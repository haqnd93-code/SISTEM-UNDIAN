const POS = [
{id:'pengerusi',t:'Pengerusi',g:1,ic:'👑'},{id:'timbalan',t:'Timbalan Pengerusi',g:1,ic:'🥈'},

const S = {tab:'guru', step:'login', voter:null, picks:{}, admin:false, sub:'dash', draft:null, votes:[], err:'', confirm:false, dbState:'wait', view:'pos', exp:{}};

function localDb(){
  const K = 'kgs_serin_db', rd = () => { try { return JSON.parse(localStorage.getItem(K) || '{}'); } catch (e) { return {}; } }, wr = o => localStorage.setItem(K, JSON.stringify(o)), subs = [];
  const fire = () => subs.slice().forEach(f => f()), snap = (p, d) => ({id: p.split('/').pop(), exists: d !== undefined, data: () => d});
  const watch = (f, fn) => { const g = () => fn(f()); subs.push(g); g(); return () => { const i = subs.indexOf(g); if (i >= 0) subs.splice(i, 1); }; };
  const doc = p => ({id: p.split('/').pop(), path: p, get: async () => snap(p, rd()[p]),
    set: async d => { const o = rd(); o[p] = d; wr(o); fire(); }, delete: async () => { const o = rd(); delete o[p]; wr(o); fire(); },
    onSnapshot: fn => watch(() => snap(p, rd()[p]), fn)});
  const qs = p => { const o = rd(); return {docs: Object.keys(o).filter(k => k.startsWith(p + '/') && !k.slice(p.length + 1).includes('/')).map(k => snap(k, o[k]))}; };
  return {doc, collection: p => ({doc: id => doc(p + '/' + id), get: async () => qs(p), onSnapshot: fn => watch(() => qs(p), fn)})};
}
function applyCfg(c){
  const sig = JSON.stringify(c || null);
  if (sig === lastCfg) return; /* tiada perubahan sebenar: jangan lukis semula halaman (punca tulisan terpadam) */
  const first = lastCfg === null; lastCfg = sig;
  const old = CFG.ver;
  if (c && c.guru) { ROSTER = c.guru; AKPS = c.akp || []; VOTERS = c.voters || c.guru.concat(c.akp || []); CFG = {club: c.club || 'KGS SERIN 2026', ver: c.ver || 0, pass: c.pass || ''}; }

  if (CFG.ver !== old && S.step === 'ballot') { S.step = 'login'; S.voter = null; S.picks = {}; }
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && app.contains(document.activeElement) && CFG.ver === old;
  if (S.dbState === 'ok' && !typing && !(S.tab === 'ajk' && S.admin && S.sub === 'set')) render();
}

const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/';
const loadJs = u => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });

function lineToEntry(raw){
  let t = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim(), akp = false;
  if (/[\(\[]\s*akp\s*[\)\]]/i.test(t) || /[\s,;-]akp$/i.test(t)) { akp = true; t = t.replace(/[\(\[]\s*akp\s*[\)\]]/ig, ' ').replace(/[\s,;-]+akp$/i, ''); }

  if (t.length < 3 || !/[a-z]{2}/i.test(t) || /^(bil|no|nama\b.*|senarai.*|jawatan|guru|akp|staf|lelaki|perempuan|jumlah.*|bahagian.*|muka surat.*|page \d+.*)\.?$/i.test(t)) return null;
  return {n: t, akp};
}
function linesToEntries(lines){

  lines.forEach(l => { if (/^\s*staf\s*$/i.test(l)) { staf = true; return; } const e = lineToEntry(l); if (e) { if (staf) e.akp = true; out.push(e); } });

}
function parseRows(rows){
  const out = []; let hr = -1, cols = [], staf = false;
  rows.some((r, i) => { const c = r.map((x, j) => /^\s*nama\b/i.test(String(x)) ? j : -1).filter(j => j >= 0); if (c.length) { hr = i; cols = c; return true; } return false; });
  rows.forEach((r, i) => {
    if (i <= hr) return;
    const cells = hr >= 0 ? cols.map(j => r[j]) : r;
    const rowAkp = r.some(x => AKP_RE.test(String(x == null ? '' : x).trim()));
    cells.forEach(x => {
      const s = String(x == null ? '' : x).trim();
      if (/^staf$/i.test(s)) { staf = true; return; }
      const e = lineToEntry(s);
      if (e && (hr >= 0 || e.n.includes(' '))) { if (staf || rowAkp) e.akp = true; out.push(e); }

}
async function parseFile(f){
  const ext = f.name.split('.').pop().toLowerCase(), sheets = [];
  if (ext === 'pdf') {
    await loadJs(CDN + 'pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise, lines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent(), rows = {};
      tc.items.forEach(it => { const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push(it); });
      Object.keys(rows).sort((a, b) => b - a).forEach(y => lines.push(rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ')));
    }
    sheets.push({name: 'PDF', entries: linesToEntries(lines)});
  } else if (ext === 'txt') {
    sheets.push({name: 'Teks', entries: linesToEntries((await f.text()).split(/\n/))});
  } else {
    await loadJs(CDN + 'xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer());
    wb.SheetNames.forEach(sn => sheets.push({name: sn, entries: parseRows(XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: ''}))}));

  return sheets.filter(s => s.entries.length);
}

function drawSettings(){
  const d = S.draft || (S.draft = {club: CFG.club, pass: '', msg: '', ok: false, vs: null, cs: null, voters: VOTERS.slice(), cand: ROSTER.map(n => ({n, akp: false})).concat(AKPS.map(n => ({n, akp: true})))});
  const col = (akp, t) => { const a = d.cand.map((x, i) => ({x, i})).filter(o => o.x.akp === akp); return `<div class='card res'><h3><span>${t}</span><span class='mut'>${a.length} nama</span></h3><div style='max-height:260px;overflow:auto'>${a.map(o => `<div class='it'><span>${esc(o.x.n)}</span><button data-t='${o.i}'>${akp ? '\u2192 Guru' : '\u2192 AKP'}</button><button data-r='${o.i}'>\u2715</button></div>`).join('') || `<p class='mut'>Tiada.</p>`}</div></div>`; };
  const up = k => `<div class='dz' id='dz-${k}'><div style='font-size:30px'>\ud83d\udcc4</div><b>Klik untuk pilih fail PDF / Excel / CSV</b></div><input type='file' id='fl-${k}' accept='.pdf,.xlsx,.xls,.csv,.txt' hidden><textarea class='f' id='pt-${k}' placeholder='\u2026atau tampal nama di sini (satu nama setiap baris)'></textarea><button class='btn ghost sm' id='ps-${k}' style='margin-top:10px'>Proses teks</button>`;
  const sel = (k, st) => st && st.sheets.length > 1 ? `<select class='f' id='sl-${k}' style='margin-top:12px'>${st.sheets.map((s, i) => `<option value='${i}' ${i === st.pick ? 'selected' : ''}>Helaian: ${esc(s.name)} (${s.entries.length} nama)</option>`).join('')}</select>` : '';
  app.innerHTML = `<h1 style='margin:0'>\u2699\ufe0f Tetapan Pemilihan</h1>
  <div class='tabs' style='display:inline-flex;margin-top:14px'><button id='s1'>Dashboard</button><button class='on'>\u2699\ufe0f Tetapan &amp; Muat Naik</button></div>
  <div class='card' style='margin-top:16px'><b>Nama kelab / tajuk pemilihan</b><input class='f' id='cl' style='margin-top:8px' value='${esc(d.club)}'></div>
  <div class='err' id='er' style='${d.ok ? 'color:var(--ok)' : ''}'>${esc(d.msg)}</div>
  <h2>\ud83d\udc65 1. Senarai Pengundi</h2><p class='mut' style='margin-bottom:12px'>Semua guru &amp; AKP yang <b>boleh mengundi</b> (cth. helaian MEMO).</p>
  ${up('v')}${sel('v', d.vs)}
  <div class='card res' style='margin-top:14px'><h3><span>Pengundi</span><span class='mut'>${d.voters.length} nama</span></h3><div style='max-height:220px;overflow:auto'>${d.voters.map((n, i) => `<div class='it'><span>${esc(n)}</span><button data-v='${i}'>\u2715</button></div>`).join('') || `<p class='mut'>Tiada.</p>`}</div></div>
  <h2>\ud83c\udfaf 2. Senarai Calon Jawatan</h2><p class='mut' style='margin-bottom:12px'>Nama yang <b>boleh dipilih</b> untuk jawatan (tidak termasuk yang sudah memegang jawatan). Nama di bawah tajuk <b>STAF</b> atau bertanda <b>(AKP)</b> dikira calon AKP.</p>
  ${up('c')}${sel('c', d.cs)}
  <div class='two'>${col(false, '\ud83c\udf93 Calon Guru')}${col(true, '\ud83d\udee0\ufe0f Calon AKP')}</div>
  <h2>\ud83d\udd11 Kata laluan AJK</h2><input class='f' id='pw2' style='margin-top:0' placeholder='Kosongkan untuk kekalkan kata laluan sedia ada' value='${esc(d.pass)}'>
  <button class='btn' id='sv'>\ud83d\udcbe Simpan senarai &amp; set semula undi</button>
  <p class='mut' style='margin-top:10px'>Menyimpan senarai baharu akan memadam semua undi sedia ada.</p>`;
  const sync = () => { d.club = $('#cl').value; d.pass = $('#pw2').value; };
  const apply = k => { const st = k === 'v' ? d.vs : d.cs, e = uniq(st.sheets[st.pick].entries); if (k === 'v') d.voters = e.map(x => x.n); else d.cand = e; };
  const load = (k, sheets) => {
    if (!sheets.length) { d.msg = 'Tiada nama dikesan. Cuba format lain atau tampal teks.'; d.ok = false; return drawSettings(); }
    const st = {sheets, pick: k === 'v' ? vPick(sheets) : cPick(sheets)};
    if (k === 'v') d.vs = st; else d.cs = st;
    apply(k);
    if (k === 'v' && sheets.length > 1 && !d.cs) { d.cs = {sheets, pick: cPick(sheets)}; apply('c'); }
    d.ok = true; d.msg = `\u2713 ${d.voters.length} pengundi dan ${d.cand.length} calon (${d.cand.filter(x => x.akp).length} AKP) dikesan. Sila semak senarai.`;
    drawSettings();
  };
  $('#s1').onclick = () => { S.sub = 'dash'; drawAdmin(); };
  ['v', 'c'].forEach(k => {
    $('#dz-' + k).onclick = () => $('#fl-' + k).click();
    $('#fl-' + k).onchange = async e => {
      const f = e.target.files[0]; if (!f) return; sync(); $('#er').textContent = 'Membaca fail\u2026';
      try { load(k, await parseFile(f)); } catch (x) { d.msg = 'Gagal membaca fail. Cuba format lain atau tampal teks.'; d.ok = false; drawSettings(); }
    };
    $('#ps-' + k).onclick = () => { sync(); const en = linesToEntries($('#pt-' + k).value.split(/\n/)); load(k, en.length ? [{name: 'Teks', entries: en}] : []); };
    const sl = $('#sl-' + k); if (sl) sl.onchange = e => { sync(); (k === 'v' ? d.vs : d.cs).pick = +e.target.value; apply(k); drawSettings(); };
  });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { sync(); const x = d.cand[+b.dataset.t]; x.akp = !x.akp; drawSettings(); });
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { sync(); d.cand.splice(+b.dataset.r, 1); drawSettings(); });
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { sync(); d.voters.splice(+b.dataset.v, 1); drawSettings(); });
  $('#sv').onclick = async () => {
    sync();
    const g = d.cand.filter(x => !x.akp).map(x => x.n), a = d.cand.filter(x => x.akp).map(x => x.n);
    if (!d.voters.length) { d.msg = 'Senarai pengundi kosong.'; d.ok = false; return drawSettings(); }
    if (g.length < 7) { d.msg = 'Calon guru mesti sekurang-kurangnya 7 nama.'; d.ok = false; return drawSettings(); }
    if (!a.length) { d.msg = 'Sekurang-kurangnya 1 calon AKP diperlukan.'; d.ok = false; return drawSettings(); }
    $('#sv').disabled = true; $('#sv').textContent = 'Menyimpan\u2026';
    try {
      await db.doc('config/main').set({club: d.club.trim() || 'KGS SERIN', guru: g, akp: a, voters: d.voters, ver: Date.now(), pass: d.pass.trim() || CFG.pass || ''});
      const old = await db.collection('votes').get();
      for (const x of old.docs) await db.collection('votes').doc(x.id).delete();
      S.draft = null; S.sub = 'dash'; drawAdmin();
    } catch (x) { d.msg = 'Gagal menyimpan. Anda mungkin perlu akses penyunting (editor) untuk menukar tetapan.'; d.ok = false; drawSettings(); }
  };
}

render();
</script>
</body>
</html>
